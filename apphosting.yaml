# Firebase App Hosting configuration — QA 환경 (`qa` 브랜치 전용)
#
# QA의 목적은 "라이브와 똑같은 조건에서 실결제까지 미리 돌려보되, 허용된 계정만 들어오게 하는
# 것"이다. 그래서 Firebase 프로젝트도 포트원 채널도 프로덕션과 **같은 것**을 쓰고, 달라지는 건
# 로그인 제한(APP_ENV + LOGIN_ALLOWED_EMAILS)과 카카오 Redirect URI뿐이다.
#
# 환경별 결제 성격:
#   로컬/main = 테스트 결제(INIpayTest) / QA = 실결제(계정 제한) / live = 실결제
#
# !! 여기서 실결제가 일어난다. 테스트할 때마다 결제 내역에서 환불까지 해야 매출 통계가 깨끗하다
#    (Firestore를 프로덕션과 공유하므로 어드민 분석에 그대로 잡힌다).
#
# !! main을 qa로 머지할 때 이 파일이 프로덕션 값으로 덮어써지지 않도록 주의할 것.
#    충돌이 나면 항상 qa 쪽(ours)을 유지한다.

runConfig:
  minInstances: 0

env:
  # QA 표식. 이 값이 "qa"일 때만 로그인 허용 목록(src/lib/auth/loginAllowlist.ts)이 동작하고
  # robots.ts가 크롤링을 막는다. 프로덕션 apphosting.yaml에는 이 변수가 없다.
  - variable: APP_ENV
    value: "qa"
    availability:
      - BUILD
      - RUNTIME

  # 로그인 허용 카카오 계정 이메일(쉼표 구분). 카카오가 로그인 시 내려주는 이메일과 대조하므로
  # 반드시 "카카오 계정 이메일"이어야 한다. 비워두면 아무도 로그인할 수 없다(fail-closed).
  - variable: LOGIN_ALLOWED_EMAILS
    value: "redteart@kakao.com"
    availability:
      - RUNTIME

  # ── 아래부터는 프로덕션(`live` 브랜치)과 동일한 값 ──────────────────────────
  # Firestore·Auth·Secret Manager를 프로덕션과 공유한다. QA에서 만든 계정과 결제 기록은
  # 실제 데이터와 같은 곳에 쌓인다 — 아직 검증되지 않은 코드가 실데이터에 쓴다는 뜻이므로,
  # 실사용자가 쌓이기 시작하면 별도 프로젝트로 분리할 것(doc/QA환경_구축.md).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCRXh6LJL3bcdff4h8qpivwxvFxPff0ikI"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "tayeon-d5149.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "tayeon-d5149"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "tayeon-d5149.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "897620122361"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:897620122361:web:4e09d26808e21cee96a028"
    availability:
      - BUILD
      - RUNTIME
  # NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID는 일부러 넣지 않는다 — QA 트래픽이 프로덕션 GA 속성에
  # 섞이지 않도록. 코드가 getAnalytics를 호출하지 않아 없어도 동작에 영향이 없다.

  # 카카오는 앱을 새로 만들지 않고 기존 앱에 QA Redirect URI만 추가한다(REST API 키 공유).
  - variable: NEXT_PUBLIC_KAKAO_REST_API_KEY
    value: "e3733ff5647eb49e88c6ff4910189d57"
    availability:
      - BUILD
      - RUNTIME
  # 카카오 콘솔의 등록된 Redirect URI와 문자 그대로 일치해야 한다(끝 슬래시·http/https 포함).
  - variable: NEXT_PUBLIC_KAKAO_REDIRECT_URI
    value: "https://tayeon-qa--tayeon-d5149.asia-east1.hosted.app/api/auth/kakao/callback"
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_SERVICE_ACCOUNT_EMAIL
    value: "firebase-adminsdk-fbsvc@tayeon-d5149.iam.gserviceaccount.com"
    availability:
      - RUNTIME

  # 포트원 — QA의 존재 이유가 실결제 검증이므로 실연동 채널을 쓴다
  # ("타연_이니시스", MID MOI6983921). 여기서 결제하면 실제 카드가 승인된다.
  # fulfill.ts의 "프로덕션에서 LIVE 채널이 아니면 지급 거부" 가드도 이 채널이라 정상 통과한다.
  - variable: NEXT_PUBLIC_PORTONE_STORE_ID
    value: "store-7dc1cefa-bad0-4cf6-b8b4-52d669e4ac8d"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PORTONE_CHANNEL_KEY
    value: "channel-key-e80d28cc-c6b2-4385-bb63-275c9dbaa5f4"
    availability:
      - BUILD
      - RUNTIME

  # Secret-backed values — 프로덕션과 같은 프로젝트라 Secret Manager 항목을 그대로 공유한다
  # (따로 등록할 필요 없음). 심사용 로그인(PG_REVIEW_TEST_*)은 QA에 불필요해서 뺐다.
  - variable: KAKAO_CLIENT_SECRET
    secret: KAKAO_CLIENT_SECRET
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
  - variable: PORTONE_API_SECRET
    secret: PORTONE_API_SECRET
    availability:
      - RUNTIME
  - variable: PORTONE_WEBHOOK_SECRET
    secret: PORTONE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    value: "Tayeon Support <support@tayeon.kr>"
    availability:
      - RUNTIME
  - variable: RESEND_ADMIN_EMAIL
    value: "tayeon@rafraum.com"
    availability:
      - RUNTIME

  # 어드민(별도 백엔드)이 이 앱의 /api/internal/notify 를 부를 때 쓰는 공유 비밀. 양쪽 값이
  # 같아야 하고, functions 의 hourlyRefundAutoApprove 도 같은 값으로 어드민을 부른다.
  # 없으면 그 경로가 503 이라 환불 알림이 조용히 사라진다.
  - variable: INTERNAL_API_SECRET
    secret: INTERNAL_API_SECRET
    availability:
      - RUNTIME
  # 운영 알림 주 채널. 한도도 만료도 없어서 일상 알림은 전부 여기로 가고, 메일은 예외 상황용이다
  # (src/lib/notify/owner.ts). 둘 다 없으면 warn/urgent 알림이 메일로만 나간다.
  - variable: DISCORD_WEBHOOK_URL
    secret: DISCORD_WEBHOOK_URL
    availability:
      - RUNTIME
  # 고객센터 문의 전용 채널. 환불과 문의가 한 채널에 섞이면 둘 다 놓친다.
  - variable: DISCORD_SUPPORT_WEBHOOK_URL
    secret: DISCORD_SUPPORT_WEBHOOK_URL
    availability:
      - RUNTIME
  # 알림 본문의 "어드민에서 처리" 링크가 가리킬 주소(src/lib/company.ts). 없으면 링크가 빠진다.
  - variable: ADMIN_BASE_URL
    value: "https://tayeon-admin--tayeon-d5149.asia-east1.hosted.app"
    availability:
      - RUNTIME
